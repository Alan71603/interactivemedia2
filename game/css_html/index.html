<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Fishing PIG</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <header id="gamecontrol">
        <h1>Ice Fishing</h1>
        <button id="startgame">Start Game</button>
    </header>

    <div id="screens">

       <!--  Player 1 -->
        <section class="player_screen">
            <div class="player" id="p1">Player 1</div>
            <img class="game_img" id="img1" src="images/redwaiting.png" alt="Player 1 img">
            <div class="player_bottom">
                <div class="player_score" id="p1score">0 fish</div>
            </div>
        </section>

        <!-- Mid Console -->
        <div id="console">
            <div id="game"></div>
            <div id="dicearea"></div>
            <div id="actions"></div>
            <div id="score"></div>
        </div>

        <!-- Player 2 -->
        <section class="player_screen">
            <div class="player" id="p2">Player 2</div>
            <img class="game_img" id="img2" src="images/bluewaiting.png" alt="Player 2 img">
            <div class="player_bottom">
                <div class="player_score" id="p2score">0 fish</div>
            </div>
        </section>

    </div>

    <footer>
        <p>Designed by Chris Rodriguez</p>
    </footer>

</body>
</html>
